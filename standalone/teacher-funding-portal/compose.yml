services:
  teacher-funding-portal:
    build: .
    image: teacher-funding-portal:0.1.0
    restart: unless-stopped
    environment:
      PORTAL_DATABASE_URL: ${PORTAL_DATABASE_URL:?set the existing PostgreSQL connection URL}
      PORTAL_JWT_SECRET: ${PORTAL_JWT_SECRET:?set PORTAL_JWT_SECRET}
      PORTAL_ADMIN_USERNAME: ${PORTAL_ADMIN_USERNAME:?set PORTAL_ADMIN_USERNAME}
      PORTAL_ADMIN_PASSWORD: ${PORTAL_ADMIN_PASSWORD:?set PORTAL_ADMIN_PASSWORD}
      PORTAL_TOKEN_TTL_HOURS: ${PORTAL_TOKEN_TTL_HOURS:-12}
      PORTAL_MAX_UPLOAD_MB: ${PORTAL_MAX_UPLOAD_MB:-20}
      PORTAL_SYNC_ENABLED: ${PORTAL_SYNC_ENABLED:-true}
      PORTAL_FILEAGENT_BASE_URL: ${PORTAL_FILEAGENT_BASE_URL:-}
      PORTAL_FILEAGENT_ACCESS_TOKEN: ${PORTAL_FILEAGENT_ACCESS_TOKEN:-}
      PORTAL_SYNC_FILENAME: ${PORTAL_SYNC_FILENAME:-教师成果资助使用登记余额表.xlsx}
      PORTAL_RESEARCH_FILENAME: ${PORTAL_RESEARCH_FILENAME:-教师成果明细汇总（2019-2026）.xlsx}
      PORTAL_SYNC_INTERVAL_SECONDS: ${PORTAL_SYNC_INTERVAL_SECONDS:-60}
    ports:
      - "${PORTAL_HOST_PORT:-8766}:8080"
